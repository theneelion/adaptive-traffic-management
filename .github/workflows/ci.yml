name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  contracts-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "pnpm" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install uv
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shared-contracts generate
      - run: git diff --exit-code -- shared-contracts/generated

  unit-ts:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter sim-server --filter frontend --filter shared-contracts test

  unit-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install uv
      - run: cd ai-service && uv sync
      - run: cd ai-service && uv run ruff check .
      - run: cd ai-service && uv run pytest

  rl-regression:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'models/manifest.json') || contains(github.event.head_commit.modified, 'ai-service/training/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install uv
      - run: cd ai-service && uv sync
      - name: Train a candidate checkpoint
        run: cd ai-service && uv run python -m training.train --timesteps 50000 --out /tmp/candidate
      - name: Export candidate to ONNX
        run: |
          cd ai-service && uv run python -c "
          from stable_baselines3 import PPO
          from training.export_onnx import export_onnx
          from training.env import TrafficSignalEnv
          model = PPO.load('/tmp/candidate/ppo_traffic_signal.zip')
          export_onnx(model, obs_dim=TrafficSignalEnv().observation_space.shape[0], out_path='/tmp/candidate/model.onnx')
          "
      - name: Evaluate against the currently promoted checkpoint
        run: cd ai-service && uv run python -m training.eval_gate --candidate /tmp/candidate/model.onnx --manifest ../models/manifest.json --models-dir ../models

  integration:
    runs-on: ubuntu-latest
    needs: [unit-ts, unit-py]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "pnpm" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install uv
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shared-contracts generate
      - run: docker compose -f infra/docker-compose.yml up -d ai-service sim-server
      - name: Wait for services
        run: |
          # `curl ... && break || sleep 1` as a lone for-loop body always exits 0 (from the sleep
          # or the break), even when curl fails on every single attempt — a real bug found
          # directly: an earlier version of this loop looked like it was gating on readiness but
          # actually just burned wall-clock time and moved on regardless of outcome. wait_for now
          # explicitly fails the step (and the job) if the target never responds in time, so a
          # genuinely-never-ready service shows up as a clear failure here instead of a confusing
          # ECONNREFUSED three steps later in the actual test.
          wait_for() {
            for i in $(seq 1 "$2"); do
              curl -sf -o /dev/null "$1" && return 0
              sleep 1
            done
            echo "::error::timed out waiting for $1"
            return 1
          }
          wait_for http://localhost:8000/health 30
          # sim-server has no dedicated /health route (see src/server.ts), just a plain HTTP
          # listener — a plain GET at "/" 404s when frontend/dist isn't present, so this can't use
          # -f (which treats 4xx as failure); curl's connection-level exit code alone (0 only on a
          # real accepted response) is what distinguishes "listening" from ECONNREFUSED here.
          sim_server_ready=1
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8080/; then
              sim_server_ready=0
              break
            fi
            sleep 1
          done
          if [ "$sim_server_ready" -ne 0 ]; then
            echo "::error::timed out waiting for http://localhost:8080/"
            exit 1
          fi
      - run: RUN_INTEGRATION=1 pnpm --filter sim-server test -- multiClient.integration
      - if: always()
        run: docker compose -f infra/docker-compose.yml logs
      - if: always()
        run: docker compose -f infra/docker-compose.yml down
