services:
  ai-service:
    build:
      context: ..
      dockerfile: ai-service/Dockerfile
    ports: ["8000:8000"]
  sim-server:
    build:
      context: ..
      dockerfile: sim-server/Dockerfile
    ports: ["8080:8080"]
    depends_on: [ai-service]
    environment:
      - AI_SERVICE_URL=http://ai-service:8000
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports: ["5173:5173"]
    depends_on: [sim-server]
