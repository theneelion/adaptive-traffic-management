[project]
name = "ai-service"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "pydantic>=2.9.0",
  "gymnasium>=0.29.1",
  "stable-baselines3>=2.3.2",
  "torch>=2.4.0",
  "onnx>=1.16.2",
  "onnxruntime>=1.19.2",
  "numpy>=2.0.0"
]

[tool.uv]
package = false
dev-dependencies = ["pytest>=8.3.2", "httpx>=0.27.2", "ruff>=0.6.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["slow: training/PPO-driven tests that spin up real envs, excluded from the fast unit-py CI path via -m 'not slow'"]

[tool.ruff.lint]
# I001 (isort import-block grouping) is intentionally off: this project's code consistently
# mixes third-party and first-party imports without a blank-line separator, and enforcing it
# would mean touching nearly every file for a purely cosmetic reason.
ignore = ["I001"]
